<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>颐安心养 - 智慧养老服务平台</title>
	<style>
		:root {
			--bg: #f8f4ea;
			--surface: #fffdf8;
			--primary: #177e6c;
			--primary-deep: #0f5f51;
			--accent: #f4a259;
			--text: #283138;
			--muted: #6c7a86;
			--line: #e7ddd0;
			--good: #1f8f4b;
			--shadow: 0 10px 30px rgba(23, 126, 108, 0.14);
			--radius-lg: 18px;
			--radius-md: 14px;
			--radius-sm: 10px;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
			color: var(--text);
			background:
				radial-gradient(circle at 88% -6%, #ffe9c8 0%, rgba(255, 233, 200, 0) 36%),
				radial-gradient(circle at 0% 42%, #e3f4f0 0%, rgba(227, 244, 240, 0) 34%),
				var(--bg);
			min-height: 100vh;
		}

		.app {
			width: min(980px, 100%);
			margin: 0 auto;
			padding: 18px 14px 28px;
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 8px 2px 14px;
			animation: slide-down 0.5s ease;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.logo {
			width: 36px;
			height: 36px;
			border-radius: 12px;
			background: linear-gradient(135deg, var(--primary), #26a08a);
			color: #fff;
			display: grid;
			place-items: center;
			font-weight: 700;
			box-shadow: var(--shadow);
		}

		.brand h1 {
			margin: 0;
			font-size: 18px;
			letter-spacing: 0.5px;
		}

		.location {
			font-size: 13px;
			color: var(--muted);
			background: rgba(255, 255, 255, 0.75);
			border: 1px solid #f1e7d9;
			padding: 6px 10px;
			border-radius: 999px;
		}

		.ad-banner {
			position: relative;
			overflow: hidden;
			border-radius: var(--radius-lg);
			border: 1px solid #e5dccc;
			min-height: 170px;
			box-shadow: var(--shadow);
			animation: float-up 0.7s ease;
		}

		.slides {
			display: flex;
			transition: transform 0.45s ease;
		}

		.slide {
			min-width: 100%;
			padding: 20px;
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
			gap: 8px;
			color: #fff;
			min-height: 190px;
		}

		.slide h2 {
			margin: 0;
			font-size: 23px;
			line-height: 1.2;
		}

		.slide p {
			margin: 0;
			font-size: 14px;
			opacity: 0.95;
		}

		.slide-a {
			background: linear-gradient(120deg, #177e6c 0%, #2ca58d 70%);
		}

		.slide-b {
			background: linear-gradient(120deg, #f18f01 0%, #f7b267 72%);
		}

		.slide-c {
			background: linear-gradient(120deg, #4f709c 0%, #6f8fb8 72%);
		}

		.ad-dots {
			position: absolute;
			right: 10px;
			bottom: 10px;
			display: flex;
			gap: 7px;
			background: rgba(0, 0, 0, 0.22);
			padding: 6px 8px;
			border-radius: 999px;
		}

		.dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.55);
			border: none;
			padding: 0;
		}

		.dot.active {
			background: #fff;
			transform: scale(1.15);
		}

		.section-title {
			margin: 18px 2px 12px;
			font-size: 19px;
			font-weight: 700;
			color: #1f2a31;
			animation: fade-in 0.7s ease;
		}

		.services {
			display: grid;
			gap: 14px;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			animation: fade-in 0.8s ease;
		}

		.service-card {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: var(--radius-md);
			padding: 18px 16px;
			min-height: 170px;
			display: flex;
			flex-direction: column;
			gap: 12px;
			text-decoration: none;
			color: inherit;
			transition: transform 0.25s ease, box-shadow 0.25s ease;
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
		}

		.service-card:active,
		.service-card:hover {
			transform: translateY(-2px);
			box-shadow: 0 10px 20px rgba(23, 126, 108, 0.15);
		}

		.service-icon {
			width: 46px;
			height: 46px;
			border-radius: 12px;
			display: grid;
			place-items: center;
			font-size: 22px;
			font-weight: 700;
		}

		.service-card h3 {
			margin: 0;
			font-size: 20px;
		}

		.service-card p {
			margin: 0;
			font-size: 15px;
			color: var(--muted);
			line-height: 1.6;
		}

		.homecare .service-icon {
			background: #d8f1ec;
			color: #167a69;
		}

		.caregiving .service-icon {
			background: #ffe8cb;
			color: #d47500;
		}

		.convenient .service-icon {
			background: #dce8f8;
			color: #426d9d;
		}

		.ai-box {
			margin-top: 14px;
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: var(--radius-lg);
			overflow: hidden;
			box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
			animation: float-up 0.85s ease;
			padding: 14px;
		}

		.ai-dialog {
			width: 100%;
			min-height: 140px;
			border: 1px solid #d8e5f0;
			background: #fff;
			color: #2a3a4a;
			border-radius: 12px;
			padding: 14px;
			font-size: 15px;
			line-height: 1.6;
			outline: none;
			resize: vertical;
			font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
		}

		.ai-dialog::placeholder {
			color: #7a8a98;
		}

		.action-row {
			display: flex;
			justify-content: space-between;
			gap: 8px;
			padding: 0 2px;
			margin-top: 14px;
			animation: fade-in 0.95s ease;
		}

		.pill {
			flex: 1;
			text-align: center;
			background: rgba(255, 255, 255, 0.85);
			border: 1px dashed #d5cab9;
			border-radius: 999px;
			font-size: 12px;
			color: #6d5d4a;
			padding: 7px 10px;
		}

		@keyframes pop {
			from {
				transform: translateY(4px);
				opacity: 0;
			}
			to {
				transform: translateY(0);
				opacity: 1;
			}
		}

		@keyframes float-up {
			from {
				transform: translateY(18px);
				opacity: 0;
			}
			to {
				transform: translateY(0);
				opacity: 1;
			}
		}

		@keyframes fade-in {
			from {
				opacity: 0;
			}
			to {
				opacity: 1;
			}
		}

		@keyframes slide-down {
			from {
				transform: translateY(-10px);
				opacity: 0;
			}
			to {
				transform: translateY(0);
				opacity: 1;
			}
		}

		@media (max-width: 760px) {
			.services {
				grid-template-columns: 1fr;
			}

			.slide h2 {
				font-size: 21px;
			}

			.app {
				padding: 14px 12px 24px;
			}
		}
	</style>
</head>
<body>
	<div class="app">
		<header class="topbar">
			<div class="brand">
				<div class="logo">养</div>
				<h1>颐安心养</h1>
			</div>
			<div class="location">成都市 | 服务中</div>
		</header>

		<section class="ad-banner" aria-label="广告位">
			<div id="slides" class="slides">
				<article class="slide slide-a">
					<h2>春季健康守护套餐</h2>
					<p>上门测压 + 居家清洁 + 一键复诊提醒，适合独居长者。</p>
				</article>
				<article class="slide slide-b">
					<h2>夜间陪护 8 折预订</h2>
					<p>专业护理员持证上岗，晚间跌倒风险及时响应。</p>
				</article>
				<article class="slide slide-c">
					<h2>便民代办直达社区</h2>
					<p>医保、购药、送餐、代缴费，一次下单全链路可追踪。</p>
				</article>
			</div>
			<div class="ad-dots" id="adDots">
				<button class="dot active" data-index="0" aria-label="第1张"></button>
				<button class="dot" data-index="1" aria-label="第2张"></button>
				<button class="dot" data-index="2" aria-label="第3张"></button>
			</div>
		</section>

		<h2 class="section-title">三大服务板块</h2>
		<section class="services" aria-label="服务板块">
			<a class="service-card homecare" href="javascript:void(0)">
				<div class="service-icon">家</div>
				<h3>家政</h3>
				<p>保洁、做饭、洗护、上门维修，支持按小时与包月服务。</p>
			</a>
			<a class="service-card caregiving" href="javascript:void(0)">
				<div class="service-icon">护</div>
				<h3>陪护</h3>
				<p>医院陪诊、居家陪伴、夜间看护，关注长者安全与心理状态。</p>
			</a>
			<a class="service-card convenient" href="javascript:void(0)">
				<div class="service-icon">便</div>
				<h3>便捷服务</h3>
				<p>代买药、代缴费、代办证件、上门理疗，一键预约到家。</p>
			</a>
		</section>

		<h2 class="section-title">AI 对话智能</h2>
		<section class="ai-box">
			<textarea class="ai-dialog" placeholder="请输入您的需求，例如：老人晚上起夜频繁，想找夜间陪护和上门测压服务。"></textarea>
		</section>

		<!-- <div class="action-row">
			<div class="pill">7x24 快速响应</div>
			<div class="pill">实名认证护工</div>
			<div class="pill">价格透明可追踪</div>
		</div> -->
	</div>

	<script>
		(function () {
			var slideIndex = 0;
			var slidesEl = document.getElementById("slides");
			var dotButtons = Array.prototype.slice.call(document.querySelectorAll(".dot"));

			function setSlide(index) {
				slideIndex = index;
				slidesEl.style.transform = "translateX(-" + index * 100 + "%)";
				dotButtons.forEach(function (dot, i) {
					dot.classList.toggle("active", i === index);
				});
			}

			dotButtons.forEach(function (dot) {
				dot.addEventListener("click", function () {
					setSlide(Number(dot.getAttribute("data-index")));
				});
			});

			setInterval(function () {
				var next = (slideIndex + 1) % dotButtons.length;
				setSlide(next);
			}, 3200);
		})();
	</script>
</body>
</html>
