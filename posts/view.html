<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章 · sanmua</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <script src="/assets/js/theme.js?v=fc11f2677e"></script>
    <link rel="stylesheet" href="/assets/css/main.css?v=648a5dd28b" />
    <link rel="stylesheet" href="/assets/css/article.css?v=73ff93b1c9" />
  </head>
  <body>
    <article class="prose">
      <header class="prose__header">
        <a class="prose__back" href="/">&larr; 返回首页</a>
        <h1 class="prose__title" id="viewTitle">正在打开文章…</h1>
      </header>
      <div id="write"><p>正在跳转到文章…</p></div>
    </article>

    <script>
      // 兼容旧链接：/posts/view.html?f=slug 现在跳转到构建期生成的静态页 /posts/slug/。
      (function () {
        var params = new URLSearchParams(location.search);
        var f = params.get("f") || "";
        var scrollY = params.get("scroll");
        var titleEl = document.getElementById("viewTitle");
        var writeEl = document.getElementById("write");

        function showError(message) {
          titleEl.textContent = "文章打不开";
          writeEl.innerHTML =
            '<p>' + message + "</p><p>返回<a href=\"/\">首页</a>再看看，或翻翻<a href=\"/archives.html\">归档</a>。</p>";
        }

        if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(f) || f.indexOf("..") !== -1) {
          showError("文章参数不合法。");
          return;
        }

        var target =
          "/posts/" + encodeURIComponent(f) + "/" +
          (scrollY ? "?scroll=" + encodeURIComponent(scrollY) : "");

        fetch(target, { method: "HEAD" })
          .then(function (response) {
            if (!response.ok) throw new Error("HTTP " + response.status);
            location.replace(target);
          })
          .catch(function () {
            showError("没有读到这篇文章的静态页。若是在本地预览，请先在博客根目录运行 python tools/build_index.py 再刷新。");
          });
      })();
    </script>
    <script src="/assets/js/main.js?v=5703662ccd"></script>
  </body>
</html>
