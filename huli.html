<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>暖心养老服务</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .page-container {
            max-width: 414px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            padding: 25px 20px;
            text-align: center;
            color: #fff;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
        }
        .header p {
            font-size: 14px;
            margin-top: 5px;
            opacity: 0.9;
        }
        .service-grid {
            padding: 25px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .service-item {
            background: #fff;
            border-radius: 16px;
            padding: 20px 15px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .service-item:active {
            transform: scale(0.96);
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.04);
        }
        .service-item .icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
        }
        .service-item.clean .icon {
            background: #a8e6cf;
        }
        .service-item.diet .icon {
            background: #ffd3b6;
        }
        .service-item.repair .icon {
            background: #dcedc1;
        }
        .service-item.study .icon {
            background: #ffaaa5;
        }
        .service-item.large {
            grid-column: 1 / -1;
            padding: 25px 15px;
        }
        .service-item.large .icon {
            width: 50px;
            height: 50px;
            font-size: 24px;
        }
        .service-item.plant .icon {
            background: #88d8b0;
        }
        .service-item h3 {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }
        .service-item p {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="header">
            <h1>暖心养老服务</h1>
            <p>您的贴心生活管家</p>
        </div>
        <div class="service-grid">
            <div class="service-item clean">
                <div class="icon">🧹</div>
                <h3>保洁</h3>
                <p>居家清洁服务</p>
            </div>
            <div class="service-item diet">
                <div class="icon">🍱</div>
                <h3>定制饮食</h3>
                <p>营养膳食搭配</p>
            </div>
            <div class="service-item repair">
                <div class="icon">🔧</div>
                <h3>修理</h3>
                <p>家电设施维修</p>
            </div>
            <div class="service-item study">
                <div class="icon">📚</div>
                <h3>学生学习</h3>
                <p>陪伴辅导服务</p>
            </div>
            <div class="service-item large plant">
                <div class="icon">🌱</div>
                <h3>动植物养护</h3>
                <p>花草宠物照料</p>
            </div>
        </div>
    </div>
</body>
</html>
